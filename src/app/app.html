<div class="min-h-screen bg-[#FDFCFB] text-[#1F1F1F] flex flex-col font-sans selection:bg-[#D2E3FC] selection:text-[#0842A0]">
  
  <!-- Header Bar -->
  <app-header />

  <!-- Universal Share QR & Link Modal -->
  <app-share-modal />

  <!-- Global Toast Notification Banner -->
  @if (qaService.successMessage()) {
    <div class="fixed bottom-6 right-6 z-50 max-w-md bg-[#1F1F1F] text-white px-4 py-3 rounded-2xl shadow-xl border border-white/10 flex items-center gap-3 transition-all animate-bounce-short">
      <mat-icon class="text-[#1E8E3E] text-xl">check_circle</mat-icon>
      <span class="text-xs sm:text-sm font-medium flex-1">{{ qaService.successMessage() }}</span>
      <button
        type="button"
        (click)="qaService.successMessage.set(null)"
        class="text-[#747775] hover:text-white p-1 cursor-pointer"
      >
        <mat-icon class="text-sm">close</mat-icon>
      </button>
    </div>
  }

  @if (qaService.errorMessage()) {
    <div class="fixed bottom-6 right-6 z-50 max-w-md bg-[#D93025] text-white px-4 py-3 rounded-2xl shadow-xl border border-white/10 flex items-center gap-3 transition-all">
      <mat-icon class="text-white text-xl">error</mat-icon>
      <span class="text-xs sm:text-sm font-medium flex-1">{{ qaService.errorMessage() }}</span>
      <button
        type="button"
        (click)="qaService.errorMessage.set(null)"
        class="text-white/80 hover:text-white p-1 cursor-pointer"
      >
        <mat-icon class="text-sm">close</mat-icon>
      </button>
    </div>
  }

  <!-- Main View Router -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <router-outlet />
  </main>

  <!-- Footer -->
  <footer class="mt-auto border-t border-slate-200 bg-white/80 py-5 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-center flex-wrap gap-3">
      <div class="flex items-center gap-3 flex-wrap justify-center">
        <a
          href="https://buymeacoffee.com/yashkavaiye"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1 text-amber-700 hover:text-amber-900 font-medium transition-colors"
        >
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 3H4v10a4 4 0 004 4h6a4 4 0 004-4v-3h1.5A2.5 2.5 0 0022 7.5V5.5A2.5 2.5 0 0019.5 3H20zm-2 7V5h1.5a.5.5 0 01.5.5v2a.5.5 0 01-.5.5H18zM6 5h10v8a2 2 0 01-2 2H8a2 2 0 01-2-2V5zm2 14h8v2H8v-2z"/>
          </svg>
          <span>Buy me a coffee</span>
        </a>
        <span class="text-slate-300" aria-hidden="true">·</span>
        <a
          href="https://github.com/sponsors/Yash-Kavaiya/"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1 text-pink-600 hover:text-pink-800 font-medium transition-colors"
        >
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span>Sponsor</span>
        </a>
      </div>
    </div>
  </footer>

</div>
